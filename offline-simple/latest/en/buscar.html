<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscar en Stride Docs</title>
<style>
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.5rem; }
  input { width: 100%; padding: .6rem .8rem; font-size: 1.1rem; box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px; }
  #status { color: #666; margin: .6rem 0; }
  .hit { margin: .8rem 0; padding: .6rem .8rem; border: 1px solid #ddd; border-radius: 6px; }
  .hit a { font-weight: 600; text-decoration: none; color: #0d6efd; }
  .hit p { margin: .3rem 0 0; color: #444; font-size: .92rem; }
  .back { margin-bottom: 1rem; display: inline-block; }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Inicio</a>
<h1>Buscar en Stride Docs</h1>
<input id="q" type="search" placeholder="Ej: particle material, script, collider..." autocomplete="off" autofocus>
<div id="status"></div>
<div id="results"></div>
<script src="search-index.js"></script>
<script>
(function () {
  var data = window.STRIDE_INDEX || {};
  var entries = [];
  for (var k in data) {
    var v = data[k];
    entries.push({ href: v.href || k, title: v.title || k, summary: v.summary || '' });
  }
  var input = document.getElementById('q');
  var status = document.getElementById('status');
  var results = document.getElementById('results');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function search() {
    var q = input.value.toLowerCase().trim();
    results.innerHTML = '';
    if (q.length < 2) {
      status.textContent = entries.length + ' paginas indexadas. Escribe al menos 2 letras.';
      return;
    }
    var terms = q.split(/\s+/);
    var out = [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var t = e.title.toLowerCase();
      var s = e.summary.toLowerCase();
      var score = 0;
      for (var j = 0; j < terms.length; j++) {
        if (t.indexOf(terms[j]) >= 0) score += 10;
        if (s.indexOf(terms[j]) >= 0) score += 1;
      }
      if (score > 0) out.push({ score: score, e: e });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    status.textContent = out.length + ' resultados';
    var limit = Math.min(out.length, 50);
    for (var n = 0; n < limit; n++) {
      var e = out[n].e;
      var idx = e.summary.toLowerCase().indexOf(terms[0]);
      var start = idx < 0 ? 0 : Math.max(0, idx - 40);
      var snippet = e.summary.substring(start, start + 220);
      var div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<a href="' + esc(e.href) + '">' + esc(e.title) + '</a><p>' + esc(snippet) + '...</p>';
      results.appendChild(div);
    }
  }

  input.addEventListener('input', search);
  search();
})();
</script>
</body>
</html>
